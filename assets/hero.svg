<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" rx="8" fill="url(#darkBg)"/>
  
  <!-- Subtle Technical Grid Lines -->
  <path d="M0 40 H800 M0 80 H800 M0 120 H800 M0 160 H800 M0 200 H800" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  <path d="M100 0 V240 M200 0 V240 M300 0 V240 M400 0 V240 M500 0 V240 M600 0 V240 M700 0 V240" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>

  <!-- Border Highlight -->
  <rect x="2" y="2" width="796" height="236" rx="6" fill="none" stroke="#374151" stroke-width="1.5" opacity="0.6"/>

  <!-- Left Design Terminal Motif -->
  <text x="40" y="55" font-family="monospace" font-size="14" fill="#3B82F6" font-weight="bold">&lt;AI_ENGINEER&gt;</text>
  
  <!-- Center Main Info -->
  <text x="400" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
    AARVEE WADHWA
  </text>
  
  <text x="400" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="url(#accentGlow)" text-anchor="middle" letter-spacing="4">
    SYSTEMS THAT REASON • RETRIEVE • VERIFY
  </text>

  <!-- Bottom Core Capabilities Tags -->
  <text x="400" y="195" font-family="monospace" font-size="13" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">
